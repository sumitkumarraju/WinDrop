<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinDrop — explainer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 15px "Segoe UI", system-ui, sans-serif; color: #fff; }
  canvas { width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); display: block; }
  #play {
    position: fixed; inset: 0; margin: auto; width: 220px; height: 64px; border: 0; border-radius: 999px;
    background: #0a84ff; color: #fff; font: 600 18px "Segoe UI", system-ui, sans-serif; cursor: pointer;
    box-shadow: 0 12px 40px rgba(10,132,255,.5);
  }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play" hidden>▶ Play with sound</button>
<script>
// WinDrop explainer — a code-driven motion-graphics film.
//   explainer.html            plays in the browser (click for sound)
//   explainer.html?cut=15     the fast 15-second cut, with camera zooms and an animated cursor
//   explainer.html?export=1   renders every frame and encodes H.264 + AAC with WebCodecs (used to make the MP4)
//   explainer.html?snap=1,5   renders single frames to PNG for review
// Everything is a pure function of time t, so preview and export look identical.

const params = new URLSearchParams(location.search);
const SHORT_CUT = params.get('cut') === '15';
const W = 1920, H = 1080, FPS = 30, DURATION = SHORT_CUT ? 15 : 66;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const frame = new OffscreenCanvas(W, H), fctx = frame.getContext('2d');
const layer = new OffscreenCanvas(W, H), lctx = layer.getContext('2d');

const FONT = '"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif';
const MONO = '"Cascadia Mono", Consolas, monospace';
const C = {
  white: '#f5f7fb', muted: '#97a3ba', blue: '#0a84ff', sky: '#64d2ff', green: '#30d158',
  glass: 'rgba(255,255,255,0.07)', line: 'rgba(255,255,255,0.14)',
};

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = {
  outExpo: x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  // damped spring — overshoots a little and settles, like UIKit's spring animations
  spring: x => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(10.5 * x)),
};
function rand(seed) { // mulberry32
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- icons (Lucide paths) ----------
const ICONS = {
  logo: 'M12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4zM16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14',
  check: 'M20 6 9 17l-5-5',
  lock: 'M7 11V7a5 5 0 0 1 10 0v4M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z',
  wifi: 'M12 20h.01M2 8.82a15 15 0 0 1 20 0M5 12.86a10 10 0 0 1 14 0M8.5 16.43a5 5 0 0 1 7 0',
  globe: 'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20zM2 12h20M12 2a15.3 15.3 0 0 1 4 10a15.3 15.3 0 0 1-4 10a15.3 15.3 0 0 1-4-10a15.3 15.3 0 0 1 4-10z',
  bell: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0',
  power: 'M12 2v10M18.4 6.6a9 9 0 1 1-12.77.04',
  refresh: 'M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5',
  image: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 7a2 2 0 1 0 0 4a2 2 0 1 0 0-4zM21 15l-3.09-3.09a2 2 0 0 0-2.82 0L6 21',
  video: 'm16 13 5.22 3.48a.5.5 0 0 0 .78-.42V7.94a.5.5 0 0 0-.76-.43L16 10.5M4 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z',
  archive: 'M3 3h18a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4',
  file: 'M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7ZM14 2v4a2 2 0 0 0 2 2h4',
  laptop: 'M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16',
  phone: 'M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM12 18h.01',
  send: 'M12 19V5M5 12l7-7 7 7',
};
const iconCache = {};
function icon(c, name, cx, cy, size, color, lw = 1.8) {
  const p = iconCache[name] || (iconCache[name] = new Path2D(ICONS[name]));
  c.save();
  c.translate(cx - size / 2, cy - size / 2);
  c.scale(size / 24, size / 24);
  c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = color;
  c.stroke(p);
  c.restore();
}

// ---------- drawing helpers ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

function glass(c, x, y, w, h, r, { fill = C.glass, line = C.line, shadow = 1 } = {}) {
  c.save();
  if (shadow) { c.shadowColor = `rgba(0,0,0,${0.45 * shadow})`; c.shadowBlur = 60; c.shadowOffsetY = 22; }
  rr(c, x, y, w, h, r); c.fillStyle = fill; c.fill();
  c.shadowColor = 'transparent';
  c.lineWidth = 1.5; c.strokeStyle = line; c.stroke();
  c.restore();
}

function text(c, str, x, y, { size = 48, weight = 600, color = C.white, align = 'center', alpha = 1, font = FONT, spacing = 0 } = {}) {
  c.save();
  c.globalAlpha *= alpha;
  c.font = `${weight} ${size}px ${font}`;
  c.letterSpacing = `${spacing}px`;
  c.textAlign = align; c.textBaseline = 'alphabetic';
  c.fillStyle = color;
  c.fillText(str, x, y);
  c.restore();
}

function blueGradient(c, x0, x1) {
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, '#64d2ff'); g.addColorStop(1, '#0a84ff');
  return g;
}

// Words rise in one after another: blur + slide + spring scale (the keynote look).
function kinetic(c, words, cx, y, t, { size = 96, weight = 700, gap = 0.11, color = C.white, accent = [], align = 'center', spacing = -2 } = {}) {
  if (t <= 0) return;
  c.save();
  c.font = `${weight} ${size}px ${FONT}`;
  c.letterSpacing = `${spacing}px`;
  const widths = words.map(w => c.measureText(w).width);
  const space = size * 0.26;
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  let x = align === 'center' ? cx - total / 2 : cx;
  words.forEach((w, i) => {
    const k = clamp((t - i * gap) / 0.75);
    if (k > 0) {
      const e = ease.outExpo(k), s = ease.spring(k);
      c.save();
      c.globalAlpha *= e;
      if (e < 0.98) c.filter = `blur(${(1 - e) * 16}px)`;
      c.translate(x + widths[i] / 2, y + (1 - e) * size * 0.6);
      c.scale(0.85 + 0.15 * s, 0.85 + 0.15 * s);
      c.textAlign = 'center';
      c.fillStyle = accent.includes(i) ? blueGradient(c, -widths[i] / 2, widths[i] / 2) : color;
      c.fillText(w, 0, 0);
      c.restore();
    }
    x += widths[i] + space;
  });
  c.restore();
}

// Letters drop in one by one with a spring.
function letters(c, str, cx, y, t, { size = 140, weight = 700, stagger = 0.045, spacing = -3 } = {}) {
  if (t <= 0) return;
  c.save();
  c.font = `${weight} ${size}px ${FONT}`;
  c.letterSpacing = `${spacing}px`;
  const chars = [...str];
  const widths = chars.map(ch => c.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  chars.forEach((ch, i) => {
    const k = clamp((t - i * stagger) / 0.8);
    if (k > 0) {
      const e = ease.outExpo(k), s = ease.spring(k);
      c.save();
      c.globalAlpha *= e;
      if (e < 0.98) c.filter = `blur(${(1 - e) * 12}px)`;
      c.translate(x + widths[i] / 2, y + (1 - s) * 90);
      c.textAlign = 'center';
      c.fillStyle = C.white;
      c.fillText(ch, 0, 0);
      c.restore();
    }
    x += widths[i];
  });
  c.restore();
}

function fadeUp(c, t, fn, dist = 30) {
  if (t <= 0) return;
  const e = ease.outCubic(clamp(t / 0.6));
  c.save();
  c.globalAlpha *= e;
  c.translate(0, (1 - e) * dist);
  fn();
  c.restore();
}

function chip(c, label, cx, cy, t, { color = C.white, iconName = 'check', iconColor = C.green } = {}) {
  if (t <= 0) return;
  const s = ease.spring(clamp(t / 0.7)), e = ease.outCubic(clamp(t / 0.4));
  c.save();
  c.font = `600 30px ${FONT}`;
  const w = c.measureText(label).width + 100;
  c.globalAlpha *= e;
  c.translate(cx, cy);
  c.scale(0.7 + 0.3 * s, 0.7 + 0.3 * s);
  glass(c, -w / 2, -34, w, 68, 34, { shadow: 0.5 });
  icon(c, iconName, -w / 2 + 40, 0, 28, iconColor, 2.4);
  c.fillStyle = color; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText(label, -w / 2 + 66, 2);
  c.restore();
}

function chipRow(c, labels, cy, t, gap = 0.18, opts) {
  c.save();
  c.font = `600 30px ${FONT}`;
  const widths = labels.map(l => c.measureText(l).width + 100);
  c.restore();
  const total = widths.reduce((a, b) => a + b, 0) + 28 * (labels.length - 1);
  let x = W / 2 - total / 2;
  labels.forEach((l, i) => { chip(c, l, x + widths[i] / 2, cy, t - i * gap, opts); x += widths[i] + 28; });
}

function waves(c, cx, cy, base, t, { period = 2.6, count = 4, color = '10,132,255', max = 3.2, alpha = 0.5 } = {}) {
  for (let i = 0; i < count; i++) {
    const k = ((t / period) + i / count) % 1;
    const r = base * (1 + (max - 1) * ease.outCubic(k));
    c.save();
    c.globalAlpha *= (1 - k) * alpha;
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2);
    c.lineWidth = 2; c.strokeStyle = `rgba(${color},1)`; c.stroke();
    const g = c.createRadialGradient(cx, cy, r * 0.6, cx, cy, r);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},0.18)`);
    c.fillStyle = g; c.fill();
    c.restore();
  }
}

function appTile(c, cx, cy, size, t = 1) {
  const s = ease.spring(clamp(t));
  if (s <= 0) return;
  c.save();
  c.translate(cx, cy); c.scale(s, s);
  c.shadowColor = 'rgba(10,110,255,0.55)'; c.shadowBlur = size * 0.45; c.shadowOffsetY = size * 0.12;
  const g = c.createLinearGradient(-size / 2, -size / 2, size / 2, size / 2);
  g.addColorStop(0, '#3a9bff'); g.addColorStop(1, '#0060d0');
  rr(c, -size / 2, -size / 2, size, size, size * 0.23); c.fillStyle = g; c.fill();
  c.shadowColor = 'transparent';
  rr(c, -size / 2, -size / 2, size, size, size * 0.23); c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = 2; c.stroke();
  icon(c, 'logo', 0, 0, size * 0.62, '#fff', 2.2);
  c.restore();
}

function avatar(c, cx, cy, r, name, { ring = -1, ok = false, fill } = {}) {
  c.save();
  const g = c.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  g.addColorStop(0, ok ? '#5be37d' : '#3a9bff'); g.addColorStop(1, ok ? '#1f9d47' : '#0060d0');
  c.shadowColor = ok ? 'rgba(48,209,88,0.5)' : 'rgba(10,110,255,0.5)'; c.shadowBlur = r * 0.8;
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fillStyle = fill || g; c.fill();
  c.shadowColor = 'transparent';
  icon(c, ok ? 'check' : name, cx, cy, r * 0.95, '#fff', ok ? 2.6 : 1.7);
  if (ring >= 0) {
    c.lineCap = 'round';
    c.beginPath(); c.arc(cx, cy, r + 10, 0, Math.PI * 2); c.strokeStyle = 'rgba(255,255,255,0.12)'; c.lineWidth = 5; c.stroke();
    c.beginPath(); c.arc(cx, cy, r + 10, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ring); c.strokeStyle = ok ? C.green : C.sky; c.stroke();
  }
  c.restore();
}

function bar(c, x, y, w, k, color = C.blue) {
  rr(c, x, y, w, 8, 4); c.fillStyle = 'rgba(255,255,255,0.1)'; c.fill();
  if (k > 0) { rr(c, x, y, Math.max(8, w * k), 8, 4); c.fillStyle = color; c.fill(); }
}

function qr(c, x, y, size, seed = 7) {
  const n = 25, m = size / n, rnd = rand(seed);
  c.save();
  rr(c, x - 14, y - 14, size + 28, size + 28, 18); c.fillStyle = '#fff'; c.fill();
  c.fillStyle = '#0b1220';
  const finder = (fx, fy) => {
    c.fillRect(x + fx * m, y + fy * m, 7 * m, 7 * m);
    c.fillStyle = '#fff'; c.fillRect(x + (fx + 1) * m, y + (fy + 1) * m, 5 * m, 5 * m);
    c.fillStyle = '#0b1220'; c.fillRect(x + (fx + 2) * m, y + (fy + 2) * m, 3 * m, 3 * m);
  };
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const inFinder = (i < 8 && j < 8) || (i > n - 9 && j < 8) || (i < 8 && j > n - 9);
    if (!inFinder && rnd() > 0.52) c.fillRect(x + i * m, y + j * m, m + 0.5, m + 0.5);
  }
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  c.restore();
}

// ---------- devices ----------
function phone(c, x, y, scale, drawScreen, { alpha = 1 } = {}) {
  const w = 330, h = 680, r = 58;
  c.save();
  c.globalAlpha *= alpha;
  c.translate(x, y); c.scale(scale, scale);
  c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 80; c.shadowOffsetY = 40;
  rr(c, -w / 2, -h / 2, w, h, r); c.fillStyle = '#0b0f19'; c.fill();
  c.shadowColor = 'transparent';
  c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,0.22)'; c.stroke();
  c.save();
  rr(c, -w / 2 + 12, -h / 2 + 12, w - 24, h - 24, r - 12); c.clip();
  const g = c.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, '#0d1a33'); g.addColorStop(1, '#05070d');
  c.fillStyle = g; c.fillRect(-w / 2, -h / 2, w, h);
  c.translate(-w / 2 + 12, -h / 2 + 12);
  drawScreen(c, w - 24, h - 24);
  c.restore();
  rr(c, -52, -h / 2 + 26, 104, 30, 15); c.fillStyle = '#000'; c.fill();
  c.restore();
}

function laptop(c, x, y, scale, drawScreen) {
  const sw = 800, sh = 500;
  c.save();
  c.translate(x, y); c.scale(scale, scale);
  c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = 90; c.shadowOffsetY = 40;
  rr(c, -sw / 2 - 18, -sh / 2 - 18, sw + 36, sh + 36, 26); c.fillStyle = '#0b0f19'; c.fill();
  c.shadowColor = 'transparent';
  c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,0.2)'; c.stroke();
  // base
  c.beginPath();
  c.moveTo(-sw / 2 - 60, sh / 2 + 18); c.lineTo(sw / 2 + 60, sh / 2 + 18);
  c.lineTo(sw / 2 + 110, sh / 2 + 48); c.quadraticCurveTo(sw / 2 + 110, sh / 2 + 60, sw / 2 + 90, sh / 2 + 60);
  c.lineTo(-sw / 2 - 90, sh / 2 + 60); c.quadraticCurveTo(-sw / 2 - 110, sh / 2 + 60, -sw / 2 - 110, sh / 2 + 48);
  c.closePath();
  const bg = c.createLinearGradient(0, sh / 2 + 18, 0, sh / 2 + 60);
  bg.addColorStop(0, '#2a3142'); bg.addColorStop(1, '#141924');
  c.fillStyle = bg; c.fill();
  c.save();
  rr(c, -sw / 2, -sh / 2, sw, sh, 10); c.clip();
  const g = c.createLinearGradient(0, -sh / 2, 0, sh / 2);
  g.addColorStop(0, '#0e1a30'); g.addColorStop(1, '#060a14');
  c.fillStyle = g; c.fillRect(-sw / 2, -sh / 2, sw, sh);
  c.translate(-sw / 2, -sh / 2);
  drawScreen(c, sw, sh);
  c.restore();
  c.restore();
}

function miniHeader(c, w, label = 'WinDrop', top = 0) {
  appTile(c, 34, 34 + top, 30);
  text(c, label, 58, 44 + top, { size: 22, weight: 700, align: 'left' });
}

// ---------- background ----------
function background(c, t) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070b18'); g.addColorStop(1, '#020309');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const blobs = [
    [0.22, 0.28, 780, '10,132,255', 0.24, 0.07],
    [0.8, 0.72, 720, '100,210,255', 0.14, 0.05],
    [0.62, 0.15, 520, '48,209,88', 0.06, 0.09],
  ];
  for (const [bx, by, r, col, a, sp] of blobs) {
    const x = W * bx + Math.sin(t * sp * 6) * 120, y = H * by + Math.cos(t * sp * 5) * 90;
    const rg = c.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = rg; c.fillRect(0, 0, W, H);
  }
}

// ---------- scenes ----------
function sIntro(c, lt) {
  const cx = 960, cy = 420;
  waves(c, cx, cy, 120, lt, { alpha: 0.6 * prog(lt, 0, 0.6) });
  appTile(c, cx, cy, 220, prog(lt, 0.15, 1.25));
  letters(c, 'WinDrop', cx, 720, lt - 1.1, { size: 150 });
  fadeUp(c, lt - 2.1, () => text(c, 'AirDrop-style file sharing between iPhone and Windows', cx, 810, { size: 42, weight: 500, color: C.muted }));
  chipRow(c, ['Free', 'Open source', 'No cables'], 920, lt - 2.9);
}

function sKinetic(c, lt) {
  const seq = [['Photos.', 0.25], ['Videos.', 1.0], ['ZIPs.', 1.7], ['RARs.', 2.35]];
  seq.forEach(([word, at], i) => {
    const next = seq[i + 1] ? seq[i + 1][1] : 3.0;
    const kin = clamp((lt - at) / 0.45), kout = clamp((lt - next) / 0.3);
    if (kin <= 0 || kout >= 1) return;
    const e = ease.outExpo(kin), o = ease.inCubic(kout);
    c.save();
    c.globalAlpha = e * (1 - o);
    const blur = (1 - e) * 18 + o * 18;
    if (blur > 0.3) c.filter = `blur(${blur}px)`;
    c.translate(960, 600 + (1 - e) * 120 - o * 140);
    const s = 0.8 + 0.2 * ease.spring(kin) + o * 0.1;
    c.scale(s, s);
    c.font = `800 230px ${FONT}`; c.letterSpacing = '-6px'; c.textAlign = 'center';
    const w = c.measureText(word).width;
    c.fillStyle = i % 2 ? blueGradient(c, -w / 2, w / 2) : C.white;
    c.fillText(word, 0, 0);
    c.restore();
  });
  // orbiting file tiles
  const tiles = ['image', 'video', 'archive', 'file', 'image', 'archive'];
  const ok = prog(lt, 3.0, 3.8);
  tiles.forEach((name, i) => {
    const a = i / tiles.length * Math.PI * 2 + lt * 0.35;
    const R = lerp(200, 640, ease.outExpo(ok));
    const x = 960 + Math.cos(a) * R * 1.25, y = 540 + Math.sin(a) * R * 0.62;
    const s = ease.spring(prog(lt, 3.0 + i * 0.07, 3.8 + i * 0.07));
    if (s <= 0) return;
    c.save(); c.globalAlpha *= 0.85; c.translate(x, y); c.scale(s, s);
    glass(c, -55, -55, 110, 110, 28, { shadow: 0.6 });
    icon(c, name, 0, 0, 50, [C.sky, '#fdba74', '#fcd34d', '#93c5fd'][i % 4], 2);
    c.restore();
  });
  kinetic(c, ['Any', 'file.'], 960, 500, lt - 3.0, { size: 170, weight: 800, spacing: -5 });
  kinetic(c, ['Any', 'size.'], 960, 690, lt - 3.35, { size: 170, weight: 800, spacing: -5, accent: [1] });
  fadeUp(c, lt - 4.4, () => text(c, 'Straight from your iPhone to your PC — over your own Wi-Fi.', 960, 840, { size: 40, weight: 500, color: C.muted }));
}

function pairLaptopScreen(c, w, h, lt) {
  miniHeader(c, w);
  qr(c, 70, 110, 220);
  text(c, 'Connect your iPhone', 360, 140, { size: 30, weight: 700, align: 'left' });
  text(c, '1  Scan this code', 360, 185, { size: 22, weight: 500, align: 'left', color: C.muted });
  text(c, '2  Type the pairing code', 360, 220, { size: 22, weight: 500, align: 'left', color: C.muted });
  glass(c, 360, 260, 380, 150, 18, { fill: 'rgba(10,132,255,0.14)', shadow: 0 });
  text(c, 'PAIRING CODE', 385, 298, { size: 18, weight: 600, align: 'left', color: C.muted, spacing: 2 });
  const code = '921066';
  for (let i = 0; i < 6; i++) {
    const k = prog(lt, 1.3 + i * 0.08, 1.9 + i * 0.08);
    if (k <= 0) continue;
    c.save();
    c.globalAlpha *= ease.outCubic(k);
    text(c, code[i], 395 + i * 52 + (i > 2 ? 22 : 0), 375 - (1 - ease.spring(k)) * 40, { size: 64, weight: 700, font: MONO, align: 'left' });
    c.restore();
  }
  const left = 1 - prog(lt, 2.0, 9.5) * 0.4;
  bar(c, 385, 392, 300, left, C.sky);
}

function pairPhoneScreen(c, w, h, lt) {
  if (lt < 2.7) { // camera scanning the QR
    c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
    qr(c, 63, 200, 180, 7);
    const sy = 200 + (Math.sin(lt * 3.4) * 0.5 + 0.5) * 180;
    const g = c.createLinearGradient(0, sy - 30, 0, sy + 4);
    g.addColorStop(0, 'rgba(100,210,255,0)'); g.addColorStop(1, 'rgba(100,210,255,0.9)');
    c.fillStyle = g; c.fillRect(40, sy - 30, w - 80, 34);
    c.strokeStyle = '#ffd60a'; c.lineWidth = 5; c.lineCap = 'round';
    for (const [x, y, dx, dy] of [[40, 176, 1, 1], [w - 40, 176, -1, 1], [40, 404, 1, -1], [w - 40, 404, -1, -1]]) {
      c.beginPath(); c.moveTo(x, y + dy * 40); c.lineTo(x, y); c.lineTo(x + dx * 40, y); c.stroke();
    }
    fadeUp(c, lt - 1.6, () => {
      glass(c, 30, 470, w - 60, 70, 20, { fill: 'rgba(255,255,255,0.14)', shadow: 0 });
      text(c, 'Open WinDrop', w / 2, 514, { size: 24, weight: 600 });
    }, 12);
    return;
  }
  const paired = lt >= 5.5;
  if (!paired) {
    const e = ease.outCubic(prog(lt, 2.7, 3.2));
    c.save(); c.globalAlpha *= e;
    appTile(c, w / 2, 150, 84);
    text(c, 'Pair with your PC', w / 2, 250, { size: 30, weight: 700 });
    text(c, 'Type the code shown on your PC', w / 2, 290, { size: 18, weight: 500, color: C.muted });
    glass(c, 26, 330, w - 52, 84, 20, { fill: 'rgba(255,255,255,0.06)', shadow: 0, line: 'rgba(100,210,255,0.6)' });
    const code = '921066';
    for (let i = 0; i < 6; i++) {
      const k = prog(lt, 3.1 + i * 0.22, 3.3 + i * 0.22);
      const x = 53 + i * 32 + (i > 2 ? 16 : 0);
      if (k <= 0) { text(c, '0', x, 388, { size: 40, weight: 600, font: MONO, color: 'rgba(255,255,255,0.18)', align: 'left' }); continue; }
      c.save(); c.globalAlpha *= k;
      text(c, code[i], x, 388 - (1 - ease.spring(k)) * 16, { size: 40, weight: 700, font: MONO, align: 'left' });
      c.restore();
    }
    rr(c, 26, 440, w - 52, 64, 18); c.fillStyle = C.blue; c.fill();
    text(c, 'Pair', w / 2, 481, { size: 24, weight: 600 });
    c.restore();
    return;
  }
  const k = prog(lt, 5.5, 6.3);
  waves(c, w / 2, 260, 70, lt, { color: '48,209,88', alpha: 0.5 });
  c.save();
  c.translate(w / 2, 260); const s = ease.spring(k); c.scale(s, s);
  avatar(c, 0, 0, 70, 'check', { ok: true });
  c.restore();
  fadeUp(c, lt - 5.8, () => {
    text(c, 'Paired', w / 2, 410, { size: 40, weight: 700 });
    text(c, 'Connects by itself from now on', w / 2, 450, { size: 19, weight: 500, color: C.muted });
  }, 16);
}

function sPair(c, lt) {
  kinetic(c, ['Pair', 'once.', 'Securely.'], 960, 150, lt - 0.15, { size: 76, accent: [2] });
  const px = lerp(-300, 600, ease.spring(prog(lt, 0.05, 1.2)));
  const lx = lerp(2300, 1300, ease.spring(prog(lt, 0.15, 1.3)));
  if (lt > 5.5) { // a glowing link once paired
    const k = ease.outCubic(prog(lt, 5.5, 6.3));
    c.save();
    c.globalAlpha *= k;
    c.setLineDash([2, 18]); c.lineCap = 'round'; c.lineWidth = 6;

    c.lineDashOffset = -lt * 60;
    c.beginPath(); c.moveTo(740, 560); c.quadraticCurveTo(900, 470, 1000, 540); c.stroke();

}

const SEND_FILES = [
  ['video', 'IMG_4021.MOV', '1.2 GB'],
  ['archive', 'Project backup.rar', '640 MB'],
  ['image', 'Holiday photos.zip', '310 MB'],
];
const fileProg = (lt, i) => ease.inOut(prog(lt, 1.8 + i * 0.85, 4.6 + i * 0.85));

function sendPhoneScreen(c, w, h, lt) {
  miniHeader(c, w, 'WinDrop', 42); // below the Dynamic Island
  rr(c, w - 128, 60, 108, 34, 17); c.fillStyle = 'rgba(48,209,88,0.15)'; c.fill();
  text(c, '● Connected', w - 74, 84, { size: 16, weight: 600, color: C.green });
  const busy = lt > 1.6 && lt < 6.6;
  waves(c, w / 2, 210, 56, lt, { period: busy ? 1.2 : 2.6, alpha: 0.55 });
  const total = SEND_FILES.reduce((s, _, i) => s + fileProg(lt, i), 0) / SEND_FILES.length;
  avatar(c, w / 2, 210, 56, 'laptop', { ring: busy || total >= 1 ? total : -1, ok: total >= 1 && lt > 6.6 });
  if (lt > 1.1 && lt < 1.7) { // tap
    const k = prog(lt, 1.1, 1.7);
    c.save(); c.globalAlpha *= 1 - k;
    c.beginPath(); c.arc(w / 2 + 20, 230, 20 + k * 60, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,0.35)'; c.fill();
    c.restore();
  }
  text(c, total >= 1 ? 'Sent to SKR' : busy ? 'Sending to SKR' : 'SKR', w / 2, 320, { size: 26, weight: 700 });
  SEND_FILES.forEach(([ic, name, size], i) => {
    const t = lt - 1.3 - i * 0.12;
    fadeUp(c, t, () => {
      const y = 360 + i * 82;
      glass(c, 14, y, w - 28, 72, 18, { shadow: 0 });
      rr(c, 26, y + 14, 44, 44, 12); c.fillStyle = 'rgba(100,210,255,0.14)'; c.fill();
      icon(c, ic, 48, y + 36, 24, C.sky, 2);
      text(c, name, 84, y + 32, { size: 17, weight: 600, align: 'left' });
      const k = fileProg(lt, i);
      text(c, k >= 1 ? `✓ Sent · ${size}` : `${Math.round(k * 100)}% of ${size}`, 84, y + 54, { size: 14, weight: 500, align: 'left', color: k >= 1 ? C.green : C.muted });
      if (k < 1) bar(c, 200, y + 46, w - 230, k);
    }, 20);
  });
}

function sendLaptopScreen(c, w, h, lt) {
  miniHeader(c, w);

  waves(c, 300, 230, 60, lt, { period: busy ? 1.2 : 2.6, alpha: 0.5 });
  avatar(c, 300, 230, 60, 'laptop');
  const total = SEND_FILES.reduce((s, _, i) => s + fileProg(lt, i), 0) / SEND_FILES.length;
  c.save();
  c.translate(130, 160);
  c.beginPath(); c.arc(0, 0, 40, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,0.08)'; c.fill();
  icon(c, 'phone', 0, 0, 34, C.sky, 1.8);
  c.lineCap = 'round'; c.lineWidth = 5;
  if (lt > 1.8) {
    c.beginPath(); c.arc(0, 0, 48, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * total);
    c.strokeStyle = total >= 1 ? C.green : C.sky; c.stroke();
  }
  text(c, 'iPhone', 0, 82, { size: 18, weight: 600 });
  c.restore();
  text(c, 'SKR', 300, 340, { size: 28, weight: 700 });
  text(c, total >= 1 ? 'Received 3 files' : busy ? 'Receiving from iPhone…' : 'Waiting for your iPhone', 300, 372, { size: 18, weight: 500, color: C.muted });
  // received list
  glass(c, 540, 90, 240, 380, 18, { shadow: 0 });
  text(c, 'Received', 560, 128, { size: 20, weight: 700, align: 'left' });

    icon(c, 'check', 96, 445, 26, C.green, 2.6);
    text(c, 'Received IMG_4021.MOV from iPhone', 124, 452, { size: 18, weight: 600, align: 'left' });
    c.restore();

}

function sSend(c, lt) {

  phone(c, 560, 590, 0.86, (cc, w, h) => sendPhoneScreen(cc, w, h, lt));
  // files flying from the phone to the PC
  SEND_FILES.forEach(([ic], i) => {
    for (let k = 0; k < 4; k++) {
      const start = 1.9 + i * 0.85 + k * 0.62;
      const p = prog(lt, start, start + 0.95);
      if (p <= 0 || p >= 1 || start > 4.6 + i * 0.85) continue;
      const e = ease.inOut(p);
      const x0 = 560, y0 = 490, x1 = 1214, y1 = 543; // phone's PC icon -> PC's own icon
      const x = lerp(x0, x1, e), y = lerp(y0, y1, e) - Math.sin(e * Math.PI) * 230;
      const s = 0.6 + Math.sin(e * Math.PI) * 0.6;
      c.save();
      c.globalAlpha *= Math.sin(p * Math.PI);
      c.shadowColor = 'rgba(100,210,255,0.8)'; c.shadowBlur = 40;
      c.translate(x, y); c.scale(s, s); c.rotate((e - 0.5) * 0.5);
      glass(c, -42, -42, 84, 84, 22, { fill: 'rgba(20,40,80,0.9)', line: 'rgba(100,210,255,0.6)', shadow: 0 });
      icon(c, ic, 0, 0, 40, C.sky, 2.2);
      c.restore();
    }
  });
  chipRow(c, ['Resumes if Wi-Fi drops', 'Full quality', 'Up to Wi-Fi speed'], 1010, lt - 7.0);
}

function flap(c, ch, x, y, t, i) {
  const w = 96, h = 132;
  glass(c, x - w / 2, y - h / 2, w, h, 16, { fill: 'rgba(255,255,255,0.08)', shadow: 0.5 });
  c.save();
  c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(x - w / 2 + 6, y); c.lineTo(x + w / 2 - 6, y); c.stroke();
  const pool = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const land = 2.4 + i * 0.13;
  let shown = ch;
  if (ch === '-') shown = '–';
  else if (t < land) shown = t < 0.4 ? '' : pool[Math.floor((t * 22 + i * 7)) % pool.length];
  const flip = t < land ? (t * 22) % 1 : 1;
  c.translate(x, y);
  c.scale(1, t < land ? Math.abs(Math.cos(flip * Math.PI)) * 0.6 + 0.4 : 1);
  c.font = `700 84px ${MONO}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = t >= land ? blueGradient(c, -30, 30) : C.white;
  c.fillText(shown, 0, 6);
  c.restore();
}

function sInternet(c, lt) {
  kinetic(c, ['Different', 'networks?'], 960, 150, lt - 0.15, { size: 74 });
  kinetic(c, ['Join', 'with', 'a', 'room', 'code.'], 960, 240, lt - 1.6, { size: 74, accent: [3, 4] });
  const nodes = [[440, 560, 'phone', 'iPhone · 5G'], [960, 520, 'globe', 'Secure tunnel'], [1480, 560, 'laptop', 'PC · Home Wi-Fi']];
  // links with moving packets
  if (lt > 1.0) {
    c.save();
    c.globalAlpha *= ease.outCubic(prog(lt, 1.0, 1.6));
    c.setLineDash([3, 16]); c.lineCap = 'round'; c.lineWidth = 5; c.strokeStyle = 'rgba(100,210,255,0.7)';
    c.lineDashOffset = -lt * 70;
    c.beginPath(); c.moveTo(540, 540); c.quadraticCurveTo(720, 420, 860, 500); c.stroke();
    c.beginPath(); c.moveTo(1060, 500); c.quadraticCurveTo(1200, 420, 1380, 540); c.stroke();
    c.restore();
  }
  nodes.forEach(([x, y, ic, label], i) => {
    const s = ease.spring(prog(lt, 0.3 + i * 0.15, 1.3 + i * 0.15));
    if (s <= 0) return;
    c.save();
    c.translate(x, y); c.scale(s, s);
    if (i === 1) waves(c, 0, 0, 90, lt, { alpha: 0.35 });
    c.beginPath(); c.arc(0, 0, i === 1 ? 100 : 86, 0, Math.PI * 2);
    c.fillStyle = 'rgba(255,255,255,0.07)'; c.fill();
    c.strokeStyle = C.line; c.lineWidth = 2; c.stroke();
    icon(c, ic, 0, 0, i === 1 ? 92 : 74, C.sky, 1.6);
    if (i === 1) {
      c.beginPath(); c.arc(64, 64, 32, 0, Math.PI * 2); c.fillStyle = C.green; c.fill();

  chipRow(c, ['Encrypted HTTPS', 'Only on when you switch it on', 'Guessing gets blocked'], 1000, lt - 4.7, 0.18, { iconName: 'lock', iconColor: C.sky });
}

// ---------- the 15-second cut: same scenes, ~1.8x faster, with camera zooms and a cursor ----------
// Piecewise-linear time remap: [[shortTime, originalTime], ...] — lets the short cut replay the
// full scenes' animations at a different pace.
function remap(t, pts) {
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i][0]) return lerp(pts[i - 1][1], pts[i][1], (t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
  }
  const [a, b] = pts.slice(-2);
  return b[1] + (t - b[0]) * (b[1] - a[1]) / (b[0] - a[0]);
}

// macOS-style pointer; scales down on press
function drawCursor(c, x, y, press = 0, alpha = 1) {
  if (alpha <= 0) return;
  c.save();
  c.globalAlpha *= alpha;
  c.translate(x, y);
  const s = 1.7 * (1 - 0.14 * press);
  c.scale(s, s);
  c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
  c.beginPath();
  c.moveTo(0, 0); c.lineTo(0, 22); c.lineTo(5.5, 16.8); c.lineTo(9.4, 25.6);
  c.lineTo(13, 24); c.lineTo(9.2, 15.4); c.lineTo(16.4, 15.4); c.closePath();
  c.fillStyle = '#111'; c.fill();
  c.shadowColor = 'transparent';
  c.lineJoin = 'round'; c.lineWidth = 1.6; c.strokeStyle = '#fff'; c.stroke();
  c.restore();
}

function clickRing(c, x, y, k) {
  if (k <= 0 || k >= 1) return;
  c.save();
  c.globalAlpha *= 1 - k;
  c.beginPath(); c.arc(x, y, 14 + ease.outCubic(k) * 46, 0, Math.PI * 2);
  c.lineWidth = 4; c.strokeStyle = C.sky; c.stroke();
  c.restore();
}

// Follow keyframes [{t, x, y}] with smooth ease-in-out glides between them.
function pathAt(keys, t) {
  if (t <= keys[0].t) return keys[0];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i].t) {
      const k = ease.inOut(prog(t, keys[i - 1].t, keys[i].t));
      return { x: lerp(keys[i - 1].x, keys[i].x, k), y: lerp(keys[i - 1].y, keys[i].y, k), z: lerp(keys[i - 1].z ?? 1, keys[i].z ?? 1, k) };
    }
  }
  return keys[keys.length - 1];
}

const SCENES = CUT.scenes;
const CAMERA = CUT.camera;

function cameraAt(t) {
  if (!CAMERA.length) return { x: W / 2, y: H / 2, z: 1 };
  const k = pathAt(CAMERA, t);
  const z = Math.max(1, k.z);
  // keep the zoomed view inside the frame
  return { x: clamp(k.x, W / (2 * z), W - W / (2 * z)), y: clamp(k.y, H / (2 * z), H - H / (2 * z)), z };
}

// Ripple origins on screen (ripples in world coordinates follow the camera at that moment)
const RIPPLES = CUT.ripples.map(r => {
  if (!r.world) return r;
  const cam = cameraAt(r.t);
  return { ...r, x: (r.x - cam.x) * cam.z + W / 2, y: (r.y - cam.y) * cam.z + H / 2 };
});

const cam = new OffscreenCanvas(W, H), cctx = cam.getContext('2d');
function applyCamera(t) {
  const { x, y, z } = cameraAt(t);
  if (z <= 1.001) return frame;
  cctx.setTransform(1, 0, 0, 1, 0, 0);
  cctx.fillStyle = '#000'; cctx.fillRect(0, 0, W, H);
  cctx.translate(W / 2, H / 2); cctx.scale(z, z); cctx.translate(-x, -y);
  cctx.drawImage(frame, 0, 0);
  return cam;
}

// Full-frame ripple: the WinDrop / Apple "Ripple" shader — each ring of the picture is pushed
// outward by amplitude·sin(f·t)·e^(−d·t) and lightened or darkened with it, plus a glowing front.
function composite(t) {
  const src = applyCamera(t);
  ctx.drawImage(src, 0, 0);
  for (const r of RIPPLES) {
    const age = t - r.t;
    if (age <= 0 || age > 2.6) continue;
    const speed = 1500, freq = 15, decay = 5.5, band = 16;
    const front = age * speed;
    const rMin = Math.max(band, front - speed * 0.75), rMax = Math.min(front, 2300);
    for (let rad = rMin; rad < rMax; rad += band) {
      const mid = rad + band / 2;
      const tt = age - mid / speed;
      if (tt <= 0) continue;
      const amt = r.a * Math.sin(freq * tt) * Math.exp(-decay * tt);
      if (Math.abs(amt) < 0.25) continue;
      const s = mid / (mid + amt); // show the picture from radius mid+amt at radius mid
      ctx.save();
      ctx.beginPath();
      ctx.arc(r.x, r.y, rad + band, 0, Math.PI * 2);
      ctx.arc(r.x, r.y, rad, 0, Math.PI * 2, true);
      ctx.clip();
      ctx.translate(r.x, r.y); ctx.scale(s, s); ctx.translate(-r.x, -r.y);
      ctx.drawImage(src, 0, 0);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const light = (0.3 * amt) / r.a;
      ctx.fillStyle = light > 0 ? `rgba(255,255,255,${light * 0.55})` : `rgba(0,0,0,${-light * 0.55})`;
      ctx.fillRect(r.x - rad - band, r.y - rad - band, (rad + band) * 2, (rad + band) * 2);
      ctx.restore();
    }
    // glowing wave front
    const glow = Math.exp(-age * 1.3);
    if (front > 30) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const g = ctx.createRadialGradient(r.x, r.y, Math.max(0, front - 90), r.x, r.y, front + 6);
      g.addColorStop(0, 'rgba(90,170,255,0)');
      g.addColorStop(0.8, `rgba(120,190,255,${0.32 * glow})`);
      g.addColorStop(1, 'rgba(120,190,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(r.x - front - 10, r.y - front - 10, (front + 10) * 2, (front + 10) * 2);
      ctx.restore();
    }
  }
  const fade = SHORT_CUT ? 0.45 : 0.9;
  if (t > DURATION - fade) { ctx.fillStyle = `rgba(0,0,0,${prog(t, DURATION - fade, DURATION)})`; ctx.fillRect(0, 0, W, H); }
  if (t < 0.4) { ctx.fillStyle = `rgba(0,0,0,${1 - prog(t, 0, 0.4)})`; ctx.fillRect(0, 0, W, H); }
}

function render(t) {
  background(fctx, t);
  for (const sc of SCENES) {
    if (t < sc.s || t >= sc.e) continue;
    const lt = t - sc.s, dur = sc.e - sc.s;
    const tr = CUT.transition;
    const inK = sc.s === 0 ? 1 : ease.outCubic(clamp(lt / tr));
    const outK = sc.e >= DURATION ? 0 : ease.inCubic(clamp((lt - (dur - tr * 0.85)) / (tr * 0.85)));
    if (inK >= 1 && outK <= 0) { fctx.save(); sc.draw(fctx, lt, dur, t); fctx.restore(); continue; }
    // iOS-style zoom transition: outgoing scene grows + blurs away, incoming one settles in
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.clearRect(0, 0, W, H);
    lctx.save(); sc.draw(lctx, lt, dur, t); lctx.restore();
    fctx.save();
    fctx.globalAlpha = inK * (1 - outK);
    const blur = (1 - inK) * 14 + outK * 14;
    if (blur > 0.3) fctx.filter = `blur(${blur}px)`;
    const s = 0.93 + 0.07 * inK + 0.08 * outK;
    fctx.translate(W / 2, H / 2); fctx.scale(s, s); fctx.translate(-W / 2, -H / 2);
    fctx.drawImage(layer, 0, 0);
    fctx.restore();
  }
  composite(t);
}

// ---------- soundtrack (synthesized, so it's free to use) ----------
function buildAudio(ac, t0 = 0) {
  const A = CUT.audio;
  const out = ac.createDynamicsCompressor();
  out.threshold.value = -14; out.ratio.value = 3;
  const master = ac.createGain();
  master.gain.setValueAtTime(0.0001, t0);
  master.gain.exponentialRampToValueAtTime(0.9, t0 + 1.2);
  master.gain.setValueAtTime(0.9, t0 + DURATION - 2.5);
  master.gain.exponentialRampToValueAtTime(0.0001, t0 + DURATION);
  master.connect(out); out.connect(ac.destination);

  // warm pad: Cmaj9 – Am9 – Fmaj9 – Gsus, 4 s per chord
  const chords = [
    [130.81, 164.81, 196.0, 246.94, 293.66],
    [110.0, 130.81, 164.81, 196.0, 246.94],
    [87.31, 110.0, 130.81, 164.81, 196.0],
    [98.0, 130.81, 146.83, 196.0, 293.66],
  ];
  const padFilter = ac.createBiquadFilter();
  padFilter.type = 'lowpass'; padFilter.frequency.value = 1100; padFilter.Q.value = 0.4;
  const padGain = ac.createGain(); padGain.gain.value = 0.5;
  padFilter.connect(padGain); padGain.connect(master);
  for (let start = 0, i = 0; start < DURATION; start += A.chord, i++) {
    for (const f of chords[i % 4]) {
      for (const det of [-7, 7]) {
        const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
        const g = ac.createGain();
        const a = t0 + start, b = t0 + Math.min(DURATION, start + A.chord * 1.2);
        g.gain.setValueAtTime(0.0001, a);
        g.gain.linearRampToValueAtTime(0.014, a + A.chord * 0.25);
        g.gain.setValueAtTime(0.014, b - A.chord * 0.35);
        g.gain.linearRampToValueAtTime(0.0001, b);
        o.connect(g); g.connect(padFilter);
        o.start(a); o.stop(b + 0.05);
      }
    }
  }
  // soft pulse through the middle
  for (let t = A.pulseFrom; t < A.pulseTo; t += A.pulseEvery) {
    const o = ac.createOscillator(); o.type = 'sine';
    const g = ac.createGain();
    o.frequency.setValueAtTime(110, t0 + t); o.frequency.exponentialRampToValueAtTime(42, t0 + t + 0.14);
    g.gain.setValueAtTime(0.0001, t0 + t); g.gain.exponentialRampToValueAtTime(0.22, t0 + t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + 0.28);
    o.connect(g); g.connect(master); o.start(t0 + t); o.stop(t0 + t + 0.3);
  }
  // whooshes on transitions
  const noise = ac.createBuffer(1, ac.sampleRate * 1.2, ac.sampleRate);
  const nd = noise.getChannelData(0); const rnd = rand(3);
  for (let i = 0; i < nd.length; i++) nd[i] = rnd() * 2 - 1;
  for (const t of A.whooshes) {
    const src = ac.createBufferSource(); src.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(350, t0 + t - 0.35); bp.frequency.exponentialRampToValueAtTime(3200, t0 + t + 0.45);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + t - 0.35); g.gain.exponentialRampToValueAtTime(0.16, t0 + t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + 0.6);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t0 + t - 0.35); src.stop(t0 + t + 0.7);
  }
  // chimes on key moments (paired, received, notifications)
  for (const t of A.chimes) {
    [[880, 0, 0.12], [1318.5, 0.09, 0.1], [2637, 0.09, 0.025]].forEach(([f, d, v]) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0 + t + d); g.gain.exponentialRampToValueAtTime(v, t0 + t + d + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + d + 1.3);
      o.connect(g); g.connect(master); o.start(t0 + t + d); o.stop(t0 + t + d + 1.4);
    });
  }
  // typing ticks (pairing digits, split-flap, terminal) and cursor clicks
  const tick = (t, gain, freq, len) => {
    const src = ac.createBufferSource(); src.buffer = noise;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(gain, t0 + t); g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + len);
    src.connect(hp); hp.connect(g); g.connect(master); src.start(t0 + t, rnd() * 0.5); src.stop(t0 + t + len + 0.01);
  };
  for (const t of A.ticks) tick(t, 0.05, 3500, 0.03);
  for (const t of A.clicks) { tick(t, 0.22, 1800, 0.025); tick(t + 0.09, 0.12, 2400, 0.02); }
}

// ---------- modes ----------
const report = msg => fetch('/log', { method: 'POST', body: String(msg) }).catch(() => {});

async function exportVideo() {
  await document.fonts.ready;
  const { Muxer, ArrayBufferTarget } = Mp4Muxer;
  const videoCfg = { codec: 'avc1.640028', width: W, height: H, bitrate: 6_000_000, framerate: FPS, avc: { format: 'avc' } };
  if (!(await VideoEncoder.isConfigSupported(videoCfg)).supported) videoCfg.codec = 'avc1.4d0028';
  if (!(await VideoEncoder.isConfigSupported(videoCfg)).supported) throw new Error('No H.264 encoder available');
  const SR = 48000;
  const audioCfg = { codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 160000 };
  const hasAudio = 'AudioEncoder' in window && (await AudioEncoder.isConfigSupported(audioCfg).catch(() => ({}))).supported;
  report(`video ${videoCfg.codec}, audio ${hasAudio ? 'aac' : 'none'}`);

  const muxer = new Muxer({
    target: new ArrayBufferTarget(),
    video: { codec: 'avc', width: W, height: H, frameRate: FPS },
    ...(hasAudio ? { audio: { codec: 'aac', numberOfChannels: 2, sampleRate: SR } } : {}),
    fastStart: 'in-memory',
  });

  if (hasAudio) {
    const off = new OfflineAudioContext(2, SR * DURATION, SR);
    buildAudio(off);
    const buf = await off.startRendering();
    const enc = new AudioEncoder({ output: (chunk, meta) => muxer.addAudioChunk(chunk, meta), error: e => report('audio error ' + e.message) });
    enc.configure(audioCfg);
    const L = buf.getChannelData(0), R = buf.getChannelData(1), N = 1024;
    for (let i = 0; i < buf.length; i += N) {
      const n = Math.min(N, buf.length - i);
      const data = new Float32Array(n * 2);
      data.set(L.subarray(i, i + n), 0); data.set(R.subarray(i, i + n), n);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i / SR * 1e6), data });
      enc.encode(ad); ad.close();
    }
    await enc.flush();
    report('audio done');
  }

  const venc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => report('video error ' + e.message) });
  venc.configure(videoCfg);
  const total = DURATION * FPS;
  for (let i = 0; i < total; i++) {
    render(i / FPS);
    const vf = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    venc.encode(vf, { keyFrame: i % (FPS * 2) === 0 });
    vf.close();
    while (venc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2));
    if (i % 60 === 0) report(`frame ${i}/${total}`);
  }
  await venc.flush();
  muxer.finalize();
  await fetch('/save', { method: 'POST', body: muxer.target.buffer });
}

async function snaps(times) {
  await document.fonts.ready;
  for (const t of times) {
    render(t);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    await fetch('/snap?t=' + t, { method: 'POST', body: blob });
  }
  await fetch('/snaps-done', { method: 'POST' });
}

function preview() {
  let start = null, audio = null;
  const loop = now => {
    if (start === null) start = now;
    const t = ((now - start) / 1000) % DURATION;
    render(t);
    requestAnimationFrame(loop);
  };
  const play = document.getElementById('play');
  play.hidden = false;
  play.onclick = () => {
    play.hidden = true;
    try { audio = new AudioContext(); buildAudio(audio, audio.currentTime + 0.05); } catch {}
    start = null;
    requestAnimationFrame(loop);
  };
  render(1.6);
}

if (params.has('export')) exportVideo().catch(e => report('FAILED ' + e.message));
else if (params.has('snap')) snaps(params.get('snap').split(',').map(Number)).catch(e => report('FAILED ' + e.message));
else preview();
</script>
